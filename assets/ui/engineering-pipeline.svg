<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Workflow: data to model to inference to API to application to deployment"><title>Workflow: data to model to inference to API to application to deployment</title><style>.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 5s linear infinite}.sweep{transform-box:fill-box;transform-origin:center;animation:sweep 12s linear infinite}.cursor{animation:pulse 1.4s steps(2,end) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes sweep{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#12222f" stroke-width=".7"/></pattern><linearGradient id="fade"><stop stop-color="#48dcff" stop-opacity=".18"/><stop offset="1" stop-color="#48dcff" stop-opacity="0"/></linearGradient></defs><rect width="100%" height="100%" rx="16" fill="#080d14"/><rect x=".5" y=".5" width="899" height="299" rx="16" fill="url(#grid)" stroke="#213748"/><text x="28" y="37" font-family="Consolas, monospace" font-size="14" fill="#91a7b9" font-weight="500" >ENGINEERING LOOP / FROM SIGNAL TO SOFTWARE</text><rect x="32" y="69" width="245" height="65" rx="8" fill="#101d29" stroke="#213748"/><text x="48" y="93" font-family="Consolas, monospace" font-size="13" fill="#6cf5b0" font-weight="600" >01</text><text x="48" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#eaf5ff" font-weight="600" >DATA</text><line x1="281" y1="102" x2="322" y2="102" stroke="#48dcff" stroke-width="2" class="flow"/><rect x="327" y="69" width="245" height="65" rx="8" fill="#101d29" stroke="#213748"/><text x="343" y="93" font-family="Consolas, monospace" font-size="13" fill="#6cf5b0" font-weight="600" >02</text><text x="343" y="119" font-family="Segoe U