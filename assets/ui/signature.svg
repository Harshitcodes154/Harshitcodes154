<svg xmlns="http://www.w3.org/2000/svg" width="900" height="241" viewBox="0 0 900 241" role="img" aria-label="Online. Build, test, learn, ship. Better questions. Stronger systems. One commit at a time."><title>Online. Build, test, learn, ship. Better questions. Stronger systems. One commit at a time.</title><style>.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:8 12;animation:flow 5s linear infinite}.sweep{transform-box:fill-box;transform-origin:center;animation:sweep 12s linear infinite}.cursor{animation:pulse 1.4s steps(2,end) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes sweep{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#12222f" stroke-width=".7"/></pattern><linearGradient id="fade"><stop stop-color="#48dcff" stop-opacity=".18"/><stop offset="1" stop-color="#48dcff" stop-opacity="0"/></linearGradient></defs><rect width="100%" height="100%" rx="16" fill="#080d14"/><rect x=".5" y=".5" width="899" height="240" rx="16" fill="url(#grid)" stroke="#213748"/><text x="28" y="37" font-family="Consolas, monospace" font-size="13" fill="#91a7b9" font-weight="400" >SESSION PERSISTENT / NEXT BUILD</text><text x="28" y="86" font-family="Consolas, monospace" font-size="25" fill="#eaf5ff" font-weight="600" >harshit@github:~ $ ./next_iteration</text><text x="28" y="131" font-family="Consolas, monospace" font-size="19" fill="#6cf5b0" font-weight="500" >STATUS   ONLINE</text><text x="28" y="168" font-family="Consolas, monospace" font-size="19" fill="#48dcff" font-weight="500" >MODE     BUILD → TEST → LEARN → SHIP</text><text x="28" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#91a7b9" font-weight="400" >Better questions. Stronger systems. One commit at a time.</text><rect x="800" y="158" width=