<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="title desc">
  <title id="title">ThermoWatch AI</title>
  <desc id="desc">An animated satellite radar sweeps across a terrain map and its thermal hotspots.</desc>
  <defs>
    <radialGradient id="radar-glow"><stop stop-color="#a7f3d0" stop-opacity=".13"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="radar-beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#a7f3d0" stop-opacity="0"/><stop offset="1" stop-color="#a7f3d0" stop-opacity=".25"/></linearGradient>
    <clipPath id="radar-clip"><circle cx="439" cy="100" r="70"/></clipPath>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.radar{transform-origin:439px 100px;animation:sweep 12s linear infinite}.hotspot{animation:signal 5s ease-in-out infinite}.second{animation-delay:2.5s}
    @keyframes sweep{to{transform:rotate(360deg)}}@keyframes signal{0%,100%{opacity:.5}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="559" height="199" rx="18" fill="#09111b" stroke="#223247"/>
  <path d="M30 36h23" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  <text x="30" y="62" font-size="10" font-weight="700" letter-spacing="2" fill="#91a4b7">SATELLITE INTELLIGENCE</text>
  <text x="28" y="108" font-size="29" font-weight="700" letter-spacing="-.8" fill="#eef4fb">ThermoWatch AI</text>
  <path d="M30 145h219" stroke="#223247"/>
  <circle cx="32" cy="166" r="2" fill="#a7f3d0"/><path d="M41 166h44m7 0h20" stroke="#223247" stroke-linecap="round"/>
  <circle cx="439" cy="100" r="79" fill="url(#radar-glow)"/>
  <circle cx="439" cy="100" r="70" fill="#0d1826" stroke="#223247"/>
  <g clip-path="url(#radar-clip)" fill="none" stroke="#223247">
    <path d="M360 121l36-28 29 19 35-38 32 12 31-24M365 140l31-25 30 18 36-38 30 14 34-27M362 160l38-25 26 17 40-39 34 16 31-24"/>
    <circle cx="439" cy="100" r="47"/><circle cx="439" cy="100" r="23"/>
    <path d="M369 100h140m-70-70v140" stroke-dasharray="2 6"/>
  </g>
  <g class="radar"><path d="M439 100V30a70 70 0 0 1 49.5 20.5Z" fill="url(#radar-beam)"/><path d="M439 100l49.5-49.5" stroke="#a7f3d0" opacity=".5"/></g>
  <g class="hotspot"><circle cx="461" cy="75" r="10" fill="#a7f3d0" fill-opacity=".06" stroke="#a7f3d0" stroke-opacity=".3"/><circle cx="461" cy="75" r="3" fill="#a7f3d0"/></g>
  <g class="hotspot second"><circle cx="413" cy="128" r="8" fill="#67e8f9" fill-opacity=".06" stroke="#67e8f9" stroke-opacity=".3"/><circle cx="413" cy="128" r="2.5" fill="#67e8f9"/></g>
  <g transform="translate(350 41) rotate(-30)" stroke="#b8a4ff" stroke-width="1.3"><rect x="-8" y="-9" width="16" height="18" rx="3" fill="#0d1826"/><path d="M-12-5h-19v11h19zm24 0h19v11H12Z" fill="#b8a4ff" fill-opacity=".12"/><path d="M0-9v-7m-4 0h8M-24-5V6m5-11V6M19-5V6m6-11V6"/><path d="M-4 10q4 8 8 0" fill="none"/></g>
  <path d="M518 154v16h-16" stroke="#91a4b7" fill="none" opacity=".4"/>
</svg>
