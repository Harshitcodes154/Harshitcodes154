<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="title desc">
  <title id="title">Wafer Defect AI</title>
  <desc id="desc">A semiconductor wafer with a slowly moving inspection beam and a highlighted defective chip.</desc>
  <defs><clipPath id="wafer-clip"><circle cx="438" cy="100" r="65"/></clipPath><linearGradient id="scan-light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9" stop-opacity="0"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".2"/></linearGradient></defs>
  <style>
