<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330">
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#050816"/><stop offset=".5" stop-color="#101a3a"/><stop offset="1" stop-color="#061b2d"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#00e5ff" stop-opacity=".45"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="330" rx="28" fill="url(#bg)"/>
<circle cx="170" cy="95" r="170" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="opacity" values=".45;.85;.45" dur="4s" repeatCount="indefinite"/>
</circle>
<g stroke="#43e8ff" stroke-opacity=".18" fill="none">
  <path d="M40 260 L180 120 L310 205 L450 75 L610 175 L760 60 L900 160 L1080 80"/>
  <path d="M80 70 L220 180 L360 95 L520 245 L700 135 L850 230 L1100 155"/>
</g>
<g fill="#6cf5ff">
  <circle cx="180" cy="120" r="5"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="75" r="5"><animate attributeName="r" values="5;9;5" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="60" r="5"><animate attributeName="r" values="4;8;4" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="160" r="5"><animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/></circle>
</g>
<g fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="125" font-size="58" font-weight="800">HARSHIT KUMAR</text>
  <text x="600" y="170" font-size="22" fill="#9eefff" letter-spacing="5">AI / ML • GENAI • COMPUTER VISION</text>
  <text x="600" y="215" font-size="16" fill="#b8c5d9">BUILDING INTELLIGENT SYSTEMS &amp; REAL-WORLD AI PRODUCTS</text>
</g>
<g font-family="monospace" font-size="13" fill="#74f6ff">
  <text x="48" y="300">python</text><text x="1080" y="300">cloud.run</text>
</g>
</svg>
