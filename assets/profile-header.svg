<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Harshit Kumar — AI / ML Developer</title>
  <desc id="desc">Building intelligence, one idea at a time. An animated neural constellation orbits a central AI core beside Harshit's name.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#16403e" stop-opacity=".75"/><stop offset="1" stop-color="#09111b" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a7f3d0"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91a4b7" stroke-opacity=".07"/></pattern>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif}
    .mono{font-family:Consolas,'Liberation Mono',monospace}
    .orbit{transform-origin:946px 213px;animation:orbit 28s linear infinite}
    .reverse{animation-direction:reverse;animation-duration:42s}
    .flow{stroke-dasharray:5 14;animation:flow 7s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
    .float{animation:float 7s ease-in-out infinite}
    .cursor{animation:cursor 2.4s ease-in-out infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes flow{to{stroke-dashoffset:-152}}
    @keyframes pulse{50%{opacity:.45;transform:scale(.85)}}
    @keyframes float{50%{transform:translateY(-7px)}}
    @keyframes cursor{50%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){.orbit,.flow,.pulse,.float,.cursor{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#09111b"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="945" cy="207" r="300" fill="url(#halo)"/>
    <path d="M48 1H1152" stroke="url(#accent)" stroke-opacity=".7"/>
    <g class="mono" font-size="17" letter-spacing="2">
      <circle cx="57" cy="49" r="5" fill="#a7f3d0" class="pulse"/>
      <text x="74" y="55" fill="#a7f3d0">HARSHITCODES154 / THE BUILD LOG</text>
    </g>
    <text x="50" y="171" fill="#eef4fb" font-size="86" font-weight="750" letter-spacing="-4">Harshit Kumar<tspan fill="#a7f3d0">.</tspan></text>
    <text x="54" y="221" fill="#a7f3d0" font-size="29" font-weight="600">AI / ML Developer</text>
    <text x="54" y="269" fill="#c4d1de" font-size="24">Building intelligence, one idea at a time.</text>
    <g class="mono" font-size="17" fill="#91a4b7">
      <text x="54" y="313">COMPUTER VISION</text><text x="231" y="313" fill="#456171">/</text>
      <text x="254" y="313">GENAI</text><text x="319" y="313" fill="#456171">/</text>
      <text x="343" y="313">AGENTS</text><text x="419" y="313" fill="#456171">/</text>
      <text x="442" y="313">CLOUD</text>
    </g>
    <g fill="none" stroke="#26434b">
      <circle cx="946" cy="213" r="153" stroke-dasharray="2 10"/>
      <circle cx="946" cy="213" r="118"/>
      <circle cx="946" cy="213" r="78" stroke="#3a6166" stroke-dasharray="4 8"/>
      <path d="M946 43V75M946 352V383M776 213H808M1084 213H1116"/>
      <path d="M836 109L1056 317M836 317L1056 109" stroke-opacity=".45"/>
    </g>
    <g class="orbit" fill="none" stroke="#67e8f9">
      <path d="M946 60A153 153 0 0 1 1099 213" stroke-width="2"/>
      <circle cx="1099" cy="213" r="6" fill="#67e8f9" stroke="#09111b" stroke-width="3"/>
    </g>
    <g class="orbit reverse" fill="none" stroke="#a7f3d0">
      <path d="M828 213A118 118 0 0 1 946 95" stroke-width="2"/>
      <circle cx="946" cy="95" r="7" fill="#a7f3d0" stroke="#09111b" stroke-width="3"/>
      <circle cx="946" cy="331" r="4" fill="#b8a4ff" stroke="none"/>
    </g>
    <path class="flow" d="M791 213H901M991 213H1101M946 60V168M946 258V366" stroke="#67e8f9" stroke-opacity=".5" fill="none"/>
    <g class="float">
      <rect x="900" y="167" width="92" height="92" rx="24" fill="#0d222c" stroke="#416c6c"/>
      <rect x="908" y="175" width="76" height="76" rx="18" fill="#112e36" stroke="#a7f3d0" stroke-opacity=".3"/>
      <text x="946" y="226" text-anchor="middle" font-size="35" font-weight="650" fill="#d4ffeb">AI</text>
    </g>
    <g class="mono" font-size="13" fill="#91a4b7" letter-spacing="2">
      <text x="946" y="27" text-anchor="middle">IDEAS INTO SYSTEMS</text>
      <text x="946" y="410" text-anchor="middle">LEARN → BUILD → SHIP</text>
    </g>
    <path d="M54 354H690" stroke="#223247"/>
    <text x="54" y="396" fill="#a7f3d0" font-size="18" class="mono">&gt; learn. build. break. improve. ship.</text>
    <rect x="421" y="381" width="9" height="19" rx="1" fill="#a7f3d0" class="cursor"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="24" fill="none" stroke="#223247"/>
</svg>
